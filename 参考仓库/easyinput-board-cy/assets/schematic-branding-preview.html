<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyInput V2.0 品牌版原理图预览</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #111; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 32px; }
    main { width: min(1440px, 100%); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
             padding-bottom: 18px; border-bottom: 1px solid #d9d9d9; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; }
    p { margin: 0; color: #666; font-size: 14px; }
    figure { margin: 32px 0 0; }
    figcaption { margin-bottom: 10px; font-size: 13px; color: #555; }
    img { display: block; width: 100%; height: auto; background: #fff; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>EasyInput V2.0 · Hardware Schematic</h1>
      <p>品牌标题栏审阅版</p>
    </header>
    <figure>
      <figcaption>Sheet 1 / 2</figcaption>
      <img src="easyinput-v2-schematic-page-1-branded.svg" alt="EasyInput V2.0 原理图第一页品牌版">
    </figure>
    <figure>
      <figcaption>Sheet 2 / 2</figcaption>
      <img src="easyinput-v2-schematic-page-2-branded.svg" alt="EasyInput V2.0 原理图第二页品牌版">
    </figure>
  </main>
</body>
</html>
