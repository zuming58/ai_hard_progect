<svg xmlns="http://www.w3.org/2000/svg" width="720" height="970" viewBox="0 0 720 970" role="img" aria-labelledby="title desc">
  <title id="title">EasyInput 五层验证证据阶梯</title>
  <desc id="desc">静态检查、目标构建、烧录成功、应用日志和物理现象是五层独立证据。baseline checker 的 PASS 只证明第一层未发现已建模冲突，不等于整板验证。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#66706a"/>
    </marker>
  </defs>
  <rect width="720" height="970" fill="#f5f6f1"/>
  <text x="40" y="46" fill="#17642f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" letter-spacing="2">EVIDENCE / FIVE CLAIMS</text>
  <text x="40" y="96" fill="#101410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="800">一次 PASS，只到第一层。</text>
  <line x1="40" y1="122" x2="680" y2="122" stroke="#c9cec6"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="40" y="150" width="640" height="100" fill="#17642f"/>
    <text x="68" y="188" fill="#d9f2df" font-size="21" font-weight="800">01 · STATIC</text>
    <text x="250" y="215" fill="#ffffff" font-size="34" font-weight="800">静态检查</text>

    <line x1="360" y1="255" x2="360" y2="286" stroke="#66706a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="300" width="640" height="100" fill="none" stroke="#98a39d" stroke-width="2"/>
    <text x="68" y="338" fill="#66706a" font-size="21" font-weight="800">02 · BUILD</text>
    <text x="250" y="365" fill="#101410" font-size="34" font-weight="800">目标构建</text>

    <line x1="360" y1="405" x2="360" y2="436" stroke="#66706a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="450" width="640" height="100" fill="none" stroke="#98a39d" stroke-width="2"/>
    <text x="68" y="488" fill="#66706a" font-size="21" font-weight="800">03 · FLASH</text>
    <text x="250" y="515" fill="#101410" font-size="34" font-weight="800">烧录成功</text>

    <line x1="360" y1="555" x2="360" y2="586" stroke="#66706a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="600" width="640" height="100" fill="none" stroke="#98a39d" stroke-width="2"/>
    <text x="68" y="638" fill="#66706a" font-size="21" font-weight="800">04 · LOG</text>
    <text x="250" y="665" fill="#101410" font-size="34" font-weight="800">应用日志</text>

    <line x1="360" y1="705" x2="360" y2="736" stroke="#66706a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="750" width="640" height="100" fill="none" stroke="#98a39d" stroke-width="2"/>
    <text x="68" y="788" fill="#66706a" font-size="21" font-weight="800">05 · HIL</text>
    <text x="250" y="815" fill="#101410" font-size="34" font-weight="800">物理现象</text>
  </g>

  <text x="40" y="900" fill="#17642f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="800">check_board_baseline.py → PASS</text>
  <text x="40" y="938" fill="#b42318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">只证明静态层 ≠ 整板已验证</text>
</svg>
