<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1260" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc">
  <title id="title">GPIO8 共享电源域与安全生命周期</title>
  <desc id="desc">GPIO8 高有效，同时为五颗 WS2812、I2S 麦克风和 I2S 扬声器供电。图中列出三个消费者、未知的固定最短稳定时间，以及安全上电和关断顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#17642f"/>
    </marker>
  </defs>
  <rect width="720" height="1260" fill="#f5f6f1"/>
  <text x="40" y="46" fill="#17642f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800" letter-spacing="2">GPIO8 / SHARED POWER</text>
  <text x="40" y="94" fill="#101410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="800">共同电源，共同生命周期。</text>
  <line x1="40" y1="120" x2="680" y2="120" stroke="#c9cec6"/>

  <rect x="40" y="150" width="640" height="105" fill="#17642f"/>
  <text x="68" y="193" fill="#d9f2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="800">GPIO8 HIGH</text>
  <text x="68" y="231" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="800">共享电源域 ON</text>
  <path d="M360 255V280H80V647" fill="none" stroke="#17642f" stroke-width="4"/>
  <text x="110" y="292" fill="#17642f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="800">同一母线的三条分支</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <line x1="80" y1="357" x2="130" y2="357" stroke="#17642f" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="140" y="310" width="540" height="95" fill="none" stroke="#101410" stroke-width="2"/>
    <text x="168" y="347" fill="#101410" font-size="31" font-weight="800">LED · 5× WS2812</text>
    <text x="168" y="382" fill="#59655e" font-size="28">数据 GPIO12</text>

    <line x1="80" y1="502" x2="130" y2="502" stroke="#17642f" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="140" y="455" width="540" height="95" fill="none" stroke="#101410" stroke-width="2"/>
    <text x="168" y="492" fill="#101410" font-size="31" font-weight="800">MIC · I2S 麦克风</text>
    <text x="168" y="527" fill="#59655e" font-size="28">GPIO9 / GPIO10 / GPIO11</text>

    <line x1="80" y1="647" x2="130" y2="647" stroke="#17642f" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="140" y="600" width="540" height="95" fill="none" stroke="#101410" stroke-width="2"/>
    <text x="168" y="637" fill="#101410" font-size="31" font-weight="800">SPK · I2S 扬声器</text>
    <text x="168" y="672" fill="#59655e" font-size="28">GPIO14 / GPIO13 / GPIO15</text>
  </g>

  <rect x="40" y="750" width="640" height="105" fill="#fff1ee" stroke="#b42318" stroke-width="2"/>
  <text x="68" y="792" fill="#b42318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="800">固定最短稳定时间：UNKNOWN</text>
  <text x="68" y="830" fill="#59655e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27">由器件规格或实板测量确认</text>

  <rect x="40" y="900" width="640" height="135" fill="#edf6ef" stroke="#17642f" stroke-width="2"/>
  <text x="68" y="938" fill="#17642f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">POWER ON</text>
  <text x="68" y="978" fill="#101410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">1 锁存安全输出 → 2 GPIO8 ↑</text>
  <text x="68" y="1013" fill="#101410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">3 确认稳定 → 4 初始化消费者</text>

  <rect x="40" y="1080" width="640" height="135" fill="#fff1ee" stroke="#b42318" stroke-width="2"/>
  <text x="68" y="1118" fill="#b42318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="800">POWER OFF</text>
  <text x="68" y="1158" fill="#101410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">1 停止消费者 → 2 清空在途访问</text>
  <text x="68" y="1193" fill="#101410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">3 恢复安全引脚 → 4 GPIO8 ↓</text>
</svg>
