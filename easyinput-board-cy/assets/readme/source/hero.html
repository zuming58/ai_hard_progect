<!doctype html>

  <title>EasyInput V2.0 Board Knowledge</title>

    }

      left: 50px;
      top: 76px;
      margin: 0;
      font-size: 78px;
      line-height: .95;
      letter-spacing: -.06em;
      font-weight: 900;
    }
    .deck {
      position: absolute;
      left: 52px;
      top: 158px;
      margin: 0;

      line-height: 1.2;
      font-weight: 720;
      letter-spacing: -.025em;

      letter-spacing: .08em;
      text-align: right;
      color: #e84632;
    }
    .rule {
      position: absolute;
      left: 48px;
      right: 48px;
      top: 245px;

      background: #cbd0c7;
    }
    .board-frame {
      position: absolute;
      left: 100px;
      top: 259px;

      height: 433px;
      margin: 0;

  <main class="plate">
